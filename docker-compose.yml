services:
  web:
    image: nginx:alpine
    container_name: sami_webshop_web
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - sami_network

  php:
    build:
      context: ./docker/php
    container_name: sami_webshop_php
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-sami_webshop}
      DB_USER: ${DB_USER:-sami_user}
      DB_PASSWORD: ${DB_PASSWORD:-change_this_password}
      WP_HOME: ${WP_HOME:-http://localhost}
      WP_SITEURL: ${WP_SITEURL:-http://localhost}
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    networks:
      - sami_network

  db:
    image: mariadb:11.4
    container_name: sami_webshop_db
    restart: unless-stopped
    command: [
      '--character-set-server=utf8mb4',
      '--collation-server=utf8mb4_unicode_ci',
      '--max_allowed_packet=64M'
    ]
    environment:
      MYSQL_DATABASE: ${DB_NAME:-sami_webshop}
      MYSQL_USER: ${DB_USER:-sami_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change_this_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-${DB_PASSWORD:-change_this_password}}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - sami_network

  wpcli:
    build:
      context: ./docker/php
    container_name: sami_webshop_wpcli
    entrypoint: ["wp", "--allow-root"]
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-sami_webshop}
      DB_USER: ${DB_USER:-sami_user}
      DB_PASSWORD: ${DB_PASSWORD:-change_this_password}
      WP_HOME: ${WP_HOME:-http://localhost}
      WP_SITEURL: ${WP_SITEURL:-http://localhost}
    volumes:
      - .:/var/www/html
    depends_on:
      - db
      - php
    networks:
      - sami_network
    profiles:
      - tools

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: sami_webshop_phpmyadmin
    restart: unless-stopped
    ports:
      - "${PMA_PORT:-8080}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      - db
    networks:
      - sami_network
    profiles:
      - tools

volumes:
  db_data:

networks:
  sami_network:
    driver: bridge

